<header class="app-header" role="banner" *ngIf="auth.isLoggedIn()">
  <a routerLink="/" class="brand" (click)="closeMenu()">
    <img class="brand-logo-img" src="assets/logo-custom.png" alt="LinkedWork" />
  </a>

  <div class="header-search">
    <div class="search-box">
      <input type="text" placeholder="Buscar servicios o técnicos..." />
    </div>
  </div>

  <div class="nav-wrapper">
    <nav class="nav-links" aria-label="Navegación principal">
      <a class="nav-link" routerLink="/" (click)="closeMenu()">Inicio</a>
      <a class="nav-link" routerLink="/requests" *ngIf="auth.role() === 'ROLE_USUARIO' || auth.role() === 'ROLE_TRABAJADOR'" (click)="closeMenu()">
        {{ auth.role() === 'ROLE_TRABAJADOR' ? 'Solicitudes del área' : 'Solicitudes' }}
      </a>
      <a class="nav-link" routerLink="/farmings" (click)="closeMenu()">Técnicos</a>
      <a class="nav-link" routerLink="/active-jobs" (click)="closeMenu()">Trabajos Activos</a>
      <a class="nav-link" routerLink="/profile" (click)="closeMenu()">Perfil</a>
    </nav>
  </div>

  <div class="header-actions">
    <div class="user-block">
      <p class="user-greeting">Hola, <strong>{{ auth.userName() || 'Invitado' }}</strong></p>
    </div>
    <div class="action-buttons">
      <button type="button" class="btn btn-logout" (click)="logout()" title="Cerrar sesión">
        Salir
      </button>
    </div>
  </div>
</header>

spring.application.name=LinkedWork
# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/LinkedWork}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tonypecas16}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server Configuration
server.servlet.context-path=${CONTEXT_PATH:/LinkedApi}
server.port=${SERVER_PORT:8082}

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true
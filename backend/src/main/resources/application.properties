spring.application.name=LinkedWork
# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/LinkedWork
spring.datasource.username=root
spring.datasource.password=DEATHNOTE1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Inicialización automatizada con el script SQL de la carpeta
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:create_database.sql
spring.sql.init.continue-on-error=true

# JPA Configuration
# Hibernate actualiza automáticamente el esquema con los nuevos campos de dirección y pagos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server Configuration
server.servlet.context-path=/LinkedApi
server.port=8082

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true

